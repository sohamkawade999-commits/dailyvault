<script>
/* ---- DailyVault updater: boot loader (runs before the app) ---- */
var DV_VERSION=16; /* version of THIS file. Bump it for every release. */
(function(){
if(window.__dvLoaded)return;
try{
var raw=localStorage.getItem('dv_update');if(!raw)return;
var u=JSON.parse(raw);
if(!u||!u.html||!(u.version>DV_VERSION))return;           /* stale or invalid -> use built-in */
var tried=localStorage.getItem('dv_try'),ok=localStorage.getItem('dv_ok');
if(String(tried)===String(u.version)&&String(ok)!==String(u.version)){ /* last boot failed -> roll back */
localStorage.removeItem('dv_update');localStorage.removeItem('dv_try');return}
localStorage.setItem('dv_try',String(u.version));
window.__dvLoaded=true;
document.open();document.write(u.html);document.close();
}catch(e){}
})();
</script>

<style>
:root{--bg:#0b0505;--card:rgba(255,255,255,.05);--ink:#f3e6d0;--mute:#b79a78;--line:rgba(212,175,55,.18);--acc:#d4af37;--acc2:#d4af37;--serif:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;--gel:linear-gradient(#2a1416 0%,#1c0e0f 48%,#110809 52%,#261214 100%);--shine:inset 0 1px 0 rgba(255,255,255,.08);--glass:blur(18px) saturate(1.4);--bodybg:linear-gradient(#110807,#040202);color-scheme:dark}

.primary{background:linear-gradient(#f3dd94 0%,#d4af37 48%,#b8912a 52%,#e9cd72 100%);color:#241505;border-color:#8a6a1e;text-shadow:0 1px 0 rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 6px rgba(0,0,0,.5)}
.danger{background:linear-gradient(#e5544a 0%,#b8241a 48%,#8f160e 52%,#c93327 100%);color:#fff;border-color:#5c0f09;text-shadow:0 -1px 0 rgba(60,5,0,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 3px rgba(0,0,0,.5)}
input[type=text],input[type=password],input[type=date],textarea{font:inherit;width:100%;padding:10px 12px;-webkit-appearance:none;appearance:none;border:1px solid rgba(212,175,55,.22);border-radius:10px;background:rgba(255,255,255,.06);color:var(--ink);box-shadow:inset 0 1px 3px rgba(0,0,0,.5);outline:none;caret-color:var(--acc)}

select option{background:#1c0e0f;color:#f3e6d0}
#schedtype{padding-right:32px}
[data-plvl]{padding-right:22px;background-position:right 6px center;background-size:9px}

#pv,#nx,#pd,#nd{color:#e3c777}

.sun{filter:saturate(1.15)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:linear-gradient(rgba(9,3,3,.88),rgba(20,8,8,.88));-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border-bottom:1px solid rgba(212,175,55,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 16px rgba(0,0,0,.5);transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform}
.menu-wrap{position:relative}
#menubtn{font-size:17px;line-height:1;padding:7px 13px}
.menu-panel{position:absolute;top:calc(100% + 10px);right:0;min-width:210px;display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--gel);border:1px solid rgba(212,175,55,.25);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06);z-index:30}
.menu-panel.hidden{display:none}
.menu-panel button{width:100%;text-align:left;border-radius:10px}
.menu-panel .mute{padding:4px 12px}
.cdrop{position:relative}
.cdrop-btn{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cdrop-list{position:absolute;top:calc(100% + 4px);left:0;right:0;display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--gel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.6);z-index:31;max-height:180px;overflow-y:auto}
.cdrop-list.hidden{display:none}
.cdrop-opt{padding:7px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.cdrop-opt:hover{background:rgba(212,175,55,.16)}
.cdrop-opt[aria-selected="true"]{background:rgba(212,175,55,.28);font-weight:700}
#notifslot{flex:1;min-width:0;height:32px;display:flex;align-items:center;justify-content:center;padding:0 16px;overflow:hidden}
#notifslot .card{flex:1 1 0;min-width:0;height:32px!important;box-sizing:border-box;padding:0 6px 0 10px!important;align-items:center!important;box-shadow:none!important;overflow:hidden}
#notifslot .card span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px!important;line-height:1!important}
.flip{display:inline-flex;gap:.08em;font-family:'Helvetica Neue',Arial,sans-serif}
.fl-p{position:relative;display:flex;align-items:center;justify-content:center;width:1.35em;height:1.3em;background:linear-gradient(#242424 0 50%,#181818 50% 100%);border-radius:.08em;color:#f4f4f4;overflow:hidden;box-shadow:0 0 0 1px #000 inset}
.fl-p::after{content:"";position:absolute;left:0;right:0;top:50%;height:max(1px,.012em);background:#000;box-shadow:0 1px 0 rgba(255,255,255,.08);z-index:4}
.fl-d{font-weight:700;line-height:1;color:#f4f4f4;font-size:1em;letter-spacing:0}
.fl-ap{position:absolute;left:.12em;bottom:.1em;font-style:normal;font-size:.14em;font-weight:700;letter-spacing:.04em;color:#f4f4f4;z-index:6}
.fl-h{position:absolute;left:0;right:0;height:50%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fl-su,.fl-lf1{top:0;background:#242424;border-radius:.08em .08em 0 0}
.fl-sl,.fl-lf2{bottom:0;background:#181818;border-radius:0 0 .08em .08em}
.fl-h b{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1;color:#f4f4f4;font-size:1em}
.fl-su b,.fl-lf1 b{top:0}
.fl-sl b,.fl-lf2 b{bottom:0}
.fl-lf1,.fl-lf2{display:none;z-index:3}
.fl-lf1{transform-origin:50% 100%}
.fl-lf2{transform-origin:50% 0}
.fl-go .fl-lf1,.fl-go .fl-lf2{display:block}
.fl-go .fl-lf1{animation:flA .3s ease-in both}
.fl-go .fl-lf2{animation:flB .3s ease-out .3s both}
@keyframes flA{from{transform:perspective(4em) rotateX(0deg);filter:brightness(1)}to{transform:perspective(4em) rotateX(-90deg);filter:brightness(.55)}}
@keyframes flB{from{transform:perspective(4em) rotateX(90deg);filter:brightness(.55)}to{transform:perspective(4em) rotateX(0deg);filter:brightness(1)}}
#clock.chip{cursor:pointer;user-select:none;-webkit-user-select:none}
#clockfs{position:fixed;inset:0;z-index:300;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;cursor:default}
#clockfs .flip{font-size:min(30vw,50vh)}
#clockfs-date{margin-top:3vh;font-size:max(14px,2.6vh);color:#8a8a8a;letter-spacing:.08em;text-transform:uppercase;font-family:'Helvetica Neue',Arial,sans-serif}

main>h1{font-weight:800;letter-spacing:-.03em;background:linear-gradient(180deg,#f3dd94,#b8912a);-webkit-background-clip:text;background-clip:text;color:transparent}
::selection{background:rgba(212,175,55,.35)}
main{max-width:1280px;margin:0 auto;padding:28px 20px 60px}
.cal-layout{display:flex;gap:20px;align-items:flex-start}
.cal-layout>.card:first-child{flex:1 1 0;min-width:0}
.side-card{flex:0 0 300px;position:static}
.side-card{display:flex;flex-direction:column}
.prio-list{flex:none;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:8px;margin-right:-8px;scrollbar-width:thin;scrollbar-color:var(--acc) rgba(255,255,255,.06)}
.sched-list{flex:1;min-height:60px;overflow-y:auto;overflow-x:hidden;padding-right:8px;margin-right:-8px;scrollbar-width:thin;scrollbar-color:var(--acc) rgba(255,255,255,.06)}
.sched-list::-webkit-scrollbar{width:8px}
.sched-list::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:8px}
.sched-list::-webkit-scrollbar-thumb{background:linear-gradient(#e9cd72,#b8912a);border-radius:8px}
.sched-list::-webkit-scrollbar-thumb:hover{background:#f3dd94}
.prio-list::-webkit-scrollbar{width:8px}
.prio-list::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:8px}
.prio-list::-webkit-scrollbar-thumb{background:linear-gradient(#e9cd72,#b8912a);border-radius:8px}
.prio-list::-webkit-scrollbar-thumb:hover{background:#f3dd94}
.bday-list{height:240px;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:8px;margin-right:-8px;scrollbar-width:thin;scrollbar-color:var(--acc) rgba(255,255,255,.06)}
.bday-list::-webkit-scrollbar{width:8px}
.bday-list::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:8px}
.bday-list::-webkit-scrollbar-thumb{background:linear-gradient(#e9cd72,#b8912a);border-radius:8px}
.bday-list::-webkit-scrollbar-thumb:hover{background:#f3dd94}
@media(max-width:900px){.cal-layout{flex-direction:column}.side-card{flex:1 1 auto;width:100%;position:static}}
@media(min-width:901px){.cell{aspect-ratio:1.7;min-height:40px}.card{padding:16px}main{padding:18px 20px 32px}.grid{gap:5px}}
.prio-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:linear-gradient(rgba(255,255,255,.05),rgba(255,255,255,.02));text-align:left;width:100%}
.prio-item input[type=checkbox]{flex:none;width:18px;height:18px}
.prio-item:hover{background:rgba(255,255,255,.09)}
.prio-star{flex:none;color:#d4af37;font-size:14px;line-height:1.4}
.prio-txt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}
.prio-date{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.star-btn{color:#d4af37;border-color:#d4af3755}
.todo.priority{border-color:#d4af3766;background:linear-gradient(rgba(212,175,55,.14),rgba(212,175,55,.04))}
.card{background:var(--card);border:1px solid rgba(212,175,55,.16);border-radius:20px;padding:22px;margin-bottom:20px;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.6);isolation:isolate}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{justify-content:space-between}
.mute{color:var(--mute);font-size:12px}
.chip{font-size:12px;font-weight:600;color:#e3c777;padding:4px 12px;border-radius:999px;border:1px solid rgba(212,175,55,.28);background:rgba(212,175,55,.1);box-shadow:var(--shine)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--mute);padding:4px 0 2px}
.cell{position:relative;isolation:isolate;overflow:hidden;aspect-ratio:1.25;min-height:58px;border:1px solid rgba(212,175,55,.14);border-radius:14px;background:rgba(255,255,255,.04);box-shadow:0 1px 3px rgba(0,0,0,.5);text-align:left;padding:7px 9px;font-family:var(--serif);font-size:14px;font-weight:600;transition:transform .12s,background .12s;will-change:transform}
.daynum{display:inline-block}
:root[data-datefont="simple"] .daynum{font-family:var(--sans);font-weight:600;letter-spacing:0}
:root[data-datefont="mystic"] .daynum{font-family:"Zapfino","Apple Chancery","Segoe Script","Monotype Corsiva","French Script MT","URW Chancery L","Bradley Hand","Comic Sans MS",cursive;font-style:italic;font-weight:500;letter-spacing:.02em}
:root[data-datefont="bold"] .daynum{font-family:var(--serif);font-weight:900;letter-spacing:-.01em}
.cell::before{content:"";position:absolute;inset:0 0 50% 0;z-index:-1;background:linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,.01));pointer-events:none}
.cell:hover{background:rgba(255,255,255,.09);transform:translateY(-1px)}
.cell.out{color:rgba(255,255,255,.3);background:rgba(255,255,255,.02);box-shadow:none}
.cell.today{font-weight:700}
.sun{position:absolute;top:5px;right:6px;width:9px;height:9px;border-radius:50%;background:#3b82f6;box-shadow:0 0 4px rgba(59,130,246,.8)}
.sched-pin{position:absolute;top:5px;left:6px;font-size:12px;line-height:1}
.bday-badge{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:13px;line-height:1;pointer-events:none}
.indrow{position:absolute;right:5px;bottom:5px;display:flex;gap:2px;align-items:center}
.ind{display:inline-flex;align-items:center;gap:2px;height:14px;padding:0 4px;border-radius:7px;font-size:9px;font-weight:700;line-height:1;color:#e3c777;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 1px rgba(0,0,0,.3);font-family:var(--sans);white-space:nowrap}
.ind svg{width:9px;height:9px;flex:none}
.ind-todo.all{color:#241505;background:linear-gradient(#f3dd94,#b8912a);border-color:#8a6a1e;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 1px rgba(0,0,0,.4)}
.sw{flex:1 1 0;min-width:0;height:32px;padding:0;border:0;border-radius:0;box-shadow:none;position:relative}
.palette{position:relative;display:flex;flex:1;min-width:0;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.15),0 2px 5px rgba(0,0,0,.4)}
.palette::after{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.02));pointer-events:none}
.sw.on::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;text-shadow:0 1px 2px rgba(0,0,0,.55);pointer-events:none}
.sw.on{box-shadow:inset 0 0 0 3px rgba(255,255,255,.9)}
.todo{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:linear-gradient(rgba(255,255,255,.05),rgba(255,255,255,.02));box-shadow:var(--shine)}
.todo input{width:20px;height:20px}
.todo span{flex:1;overflow-wrap:anywhere}
.done span{text-decoration:line-through;color:var(--mute)}
.done{background:linear-gradient(rgba(120,170,100,.16),rgba(90,140,75,.1))}
.imgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.img{position:relative}.img img{height:120px;border-radius:12px;border:1px solid var(--line);display:block;cursor:zoom-in;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.img button{position:absolute;top:5px;right:5px;width:24px;height:24px;padding:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:none;line-height:1;font-size:12px;display:grid;place-items:center}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;cursor:zoom-out}
.lightbox img{max-width:92vw;max-height:92vh;border-radius:14px;box-shadow:0 10px 40px #0009}
.auth{width:calc(100% - 32px);max-width:380px;margin:12vh auto;padding:28px;background:var(--card);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border:1px solid rgba(255,255,255,.14);border-radius:24px;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.auth h1{font-size:32px;margin-bottom:6px}
.err{color:#ff6b6b;font-size:14px;min-height:20px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{position:relative;background:var(--card);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:22px;max-width:360px;width:100%;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.modal-confirm{position:absolute;inset:0;background:rgba(0,0,0,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;border-radius:20px;padding:16px;z-index:5}
.modal h3{font-size:19px;margin-bottom:14px}
.modal p{margin:0 0 10px}
.hue-swatch{width:56px;height:56px;border-radius:50%;border:4px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(8,55,60,.3);margin:0 auto 18px;position:relative;overflow:hidden}
.hue-swatch::after,.hue-thumb::after,#custom::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),transparent 45%),radial-gradient(circle at 65% 75%,rgba(0,0,0,.45),transparent 65%);pointer-events:none}
.hue-track{position:relative;width:100%;height:16px;border-radius:999px;margin:10px 0 22px;background:linear-gradient(90deg,#ff0000 0%,#ffff00 17%,#00ff00 33%,#00ffff 50%,#0000ff 67%,#ff00ff 83%,#ff0000 100%);box-shadow:inset 0 1px 3px rgba(8,55,60,.35);user-select:none;-webkit-user-select:none;touch-action:none}
.hue-thumb{position:absolute;top:50%;width:28px;height:28px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 8px rgba(8,55,60,.4);transform:translate(-50%,-50%);cursor:grab;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none;will-change:transform}
.hue-thumb:active{cursor:grabbing}
.hue-hex{text-align:center;font-size:13px;color:var(--mute);letter-spacing:.03em;margin-bottom:16px}
@media(max-width:600px){main{padding:16px 10px}.grid{gap:3px}.cell{font-size:13px;padding:4px 5px;border-radius:10px;min-height:50px}.ind{height:12px;font-size:8px;padding:0 3px}.ind svg{width:8px;height:8px}.sun{font-size:11px;top:3px;right:4px}.sched-pin{font-size:10px;top:3px;left:4px}.bday-badge{top:3px;font-size:11px}}/* pastel beach theme overrides */

/* legacy (v1) password hashing — kept only to verify + upgrade old unencrypted profiles */
async function hash(pw,salt){
try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
catch(e){let h=5381;for(const c of salt+pw)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'f'+h}
}
/* real encryption: password -> PBKDF2 -> AES-GCM key. Data at rest is now actually encrypted, not just gated by a password check. */
const PBKDF2_ITER=300000;
const b64=buf=>{const bytes=new Uint8Array(buf);let bin='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));return btoa(bin)};
const unb64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
async function deriveKey(pw,saltB64,iterations){
const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(saltB64),iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptJSON(key,obj){
const iv=crypto.getRandomValues(new Uint8Array(12));
const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
return {iv:b64(iv),ct:b64(ct)};
}
async function decryptJSON(key,payload){
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(payload.iv)},key,unb64(payload.ct));
return JSON.parse(new TextDecoder().decode(pt));
}
async function makeProfile(name,pw){
const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
const key=await deriveKey(pw,salt,PBKDF2_ITER);
const check=await encryptJSON(key,{ok:true});
return {profile:{name,salt,iterations:PBKDF2_ITER,check},key};
}

const UPDATE_URL='https://sohamkawade999-commits.github.io/dailyvault/version.json';
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

const r=await fetch(UPDATE_URL+'?t='+Date.now(),{cache:'no-store'});
if(!r.ok)throw new Error('Server returned '+r.status);
const m=await r.json();
if(!(m.version>DV_VERSION)){
updModal(`<p>You're up to date (version ${DV_VERSION}).</p><div class="row sp"><button id="uc">Close</button></div>`);
$('#uc').onclick=closeModal;return}
updModal(`<p>Version <b>${m.version}</b> is available (you have ${DV_VERSION}).</p>${m.notes?`<p class="mute">${esc(String(m.notes))}</p>`:''}<p class="mute">Your data stays untouched.</p><div class="row sp"><button id="uc">Later</button><button class="primary" id="ui">Update now</button></div>`);
$('#uc').onclick=closeModal;
$('#ui').onclick=async()=>{
updModal(`<p class="mute">Downloading…</p>`);
try{
const base=new URL(UPDATE_URL);
const u=new URL(m.url,base);
if(u.protocol!=='https:'||u.host!==base.host)throw new Error('Update file must come from the same host');
const h=await fetch(u.href,{cache:'no-store'});
if(!h.ok)throw new Error('Download failed ('+h.status+')');
const html=await h.text();
if(m.sha256&&(await sha256(html))!==String(m.sha256).toLowerCase())throw new Error('Download is corrupted (checksum mismatch)');
if(!html.includes('DV_VERSION')||!html.includes('DailyVault'))throw new Error('File does not look like a DailyVault build');
const vm=html.match(/var DV_VERSION=(\d+)/);
if(!vm||Number(vm[1])!==Number(m.version))throw new Error('Version in file does not match version.json');
localStorage.setItem('dv_update',JSON.stringify({version:m.version,html}));
localStorage.removeItem('dv_try');
updModal(`<p>Updated to version ${m.version}. Restarting…</p>`);
setTimeout(()=>location.reload(),600);
}catch(e){updModal(`<p class="err">Update failed: ${esc(e.message||String(e))}</p><div class="row sp"><button id="uc">Close</button></div>`);$('#uc').onclick=closeModal}
};
}catch(e){
updModal(`<p class="err">Couldn't check for updates. Are you online?<br><span class="mute">${esc(e.message||String(e))}</span></p><div class="row sp"><button id="uc">Close</button></div>`);
$('#uc').onclick=closeModal;
}
}

if(m){const r=parseInt(m[1].slice(0,2),16)/255,g=parseInt(m[1].slice(2,4),16)/255,b=parseInt(m[1].slice(4,6),16)/255;
const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
let h=0;if(d){if(mx===r)h=60*(((g-b)/d)%6);else if(mx===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4)}
if(h<0)h+=360;hue=h;pct=hue/360}
}
showModal(`<h3>Custom color</h3><div class="hue-swatch" id="hsw" style="background:${hueToHex(hue)}"></div>
<div class="hue-track" id="htrack"><div class="hue-thumb" id="hthumb" style="left:${pct*100}%;background:${hueToHex(hue)}"></div></div>
<div class="hue-hex" id="hhex">${hueToHex(hue).toUpperCase()}</div>
<div class="row sp"><button id="hcancel">Cancel</button><button class="primary" id="happly">Apply</button></div>`);
const track=$('#htrack'),thumb=$('#hthumb'),sw=$('#hsw'),hexLabel=$('#hhex');
let curHex=hueToHex(hue);
function update(clientX){
const r=track.getBoundingClientRect();
let p=Math.min(1,Math.max(0,(clientX-r.left)/r.width));
const h=p*360,hex=hueToHex(h);
thumb.style.left=p*100+'%';thumb.style.background=hex;sw.style.background=hex;hexLabel.textContent=hex.toUpperCase();curHex=hex;
}
let dragging=false;
const down=e=>{dragging=true;if(e.cancelable)e.preventDefault();update(e.touches?e.touches[0].clientX:e.clientX)};
const move=e=>{if(dragging){if(e.cancelable)e.preventDefault();update(e.touches?e.touches[0].clientX:e.clientX)}};
const up=()=>dragging=false;
thumb.addEventListener('mousedown',down);track.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);window.addEventListener('mouseup',up);
thumb.addEventListener('touchstart',down,{passive:true});track.addEventListener('touchstart',down,{passive:true});
window.addEventListener('touchmove',move,{passive:true});window.addEventListener('touchend',up);
$('#hcancel').onclick=closeModal;
$('#happly').onclick=()=>{v.color=curHex;save();closeModal();dayView()};
}
async function shrink(file){
const bmp=await createImageBitmap(file),r=Math.min(1,1200/Math.max(bmp.width,bmp.height));
const c=document.createElement('canvas');c.width=bmp.width*r;c.height=bmp.height*r;
c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8);
}
/* birthdays */
function refreshPage(){expDate?payView():sel?dayView():page==='sched'?schedView():calView()}
function nextOccurrence(dateStr){
const b=new Date(dateStr+'T00:00:00');
const now=new Date();now.setHours(0,0,0,0);
let next=new Date(now.getFullYear(),b.getMonth(),b.getDate());
if(next<now)next=new Date(now.getFullYear()+1,b.getMonth(),b.getDate());
return next;
}
function nextAge(dateStr){
const b=new Date(dateStr+'T00:00:00');
return nextOccurrence(dateStr).getFullYear()-b.getFullYear();
}
function openBirthdays(){
S.birthdays=S.birthdays||[];
const list=S.birthdays.slice().sort((a,b)=>nextOccurrence(a.date)-nextOccurrence(b.date));
const row=b=>{
const d=new Date(b.date+'T00:00:00'),age=nextAge(b.date);
return `<div class="todo" style="margin-bottom:8px"><span style="flex:1">🎂 ${esc(b.name)}<span class="mute" style="display:block;font-size:12px">${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}${age>0?` · turns ${age}`:''}</span></span><button data-bdel="${b.id}" aria-label="Delete birthday">✕</button></div>`;
};
showModal(`<div style="display:flex;flex-direction:column;max-height:min(70vh,520px)">

<div id="bdlist" class="bday-list" style="margin-bottom:14px;flex:0 1 auto">${list.map(row).join('')||'<p class="mute">No birthdays added yet.</p>'}</div>
<div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:8px;flex:none"><input type="text" id="bdname" placeholder="Name" style="flex:1 1 140px"><input type="date" id="bddate" style="flex:1 1 140px"></div>
<button class="primary" id="bdadd" style="width:100%;flex:none">Add birthday</button>
</div>
${pendingBdayDel?`<div class="modal-confirm" id="bdDelModal" style="cursor:default">
<div class="card" style="max-width:320px;width:100%;cursor:default;margin-bottom:0">
<h2 style="font-size:18px;margin-bottom:10px">Delete this birthday?</h2>
<p class="mute" style="margin-bottom:18px">This cannot be undone.</p>
<div class="row" style="justify-content:flex-end;gap:8px">
<button id="bdDelCancel">Cancel</button>
<button class="danger" id="bdDelConfirm">Delete</button>
</div>
</div>
</div>`:''}`);
document.querySelectorAll('[data-bdel]').forEach(b=>b.onclick=()=>{pendingBdayDel=b.dataset.bdel;openBirthdays()});
if($('#bdDelCancel'))$('#bdDelCancel').onclick=()=>{pendingBdayDel=null;openBirthdays()};
if($('#bdDelModal'))$('#bdDelModal').onclick=e=>{if(e.target.id==='bdDelModal'){pendingBdayDel=null;openBirthdays()}};
if($('#bdDelConfirm'))$('#bdDelConfirm').onclick=()=>{S.birthdays=S.birthdays.filter(x=>String(x.id)!==pendingBdayDel);pendingBdayDel=null;save();refreshPage();openBirthdays()};
$('#bdadd').onclick=()=>{
const name=$('#bdname').value.trim(),date=$('#bddate').value;
if(!name||!date)return;
S.birthdays.push({id:Date.now()+Math.random(),name,date,notified:[]});
save();refreshPage();openBirthdays();
};
$('#bdname').onkeydown=e=>{if(e.key==='Enter')$('#bdadd').click()};
}
function checkBirthdayNotifications(){
S.birthdays=S.birthdays||[];
const todayStr=key(new Date()),todayD=new Date();todayD.setHours(0,0,0,0);
let changed=false;const msgs=[];
S.birthdays.forEach(b=>{
const diff=Math.round((nextOccurrence(b.date)-todayD)/86400000);
if(diff===2||diff===1||diff===0){
b.notified=b.notified||[];
if(!b.notified.includes(todayStr)){
b.notified.push(todayStr);changed=true;
const when=diff===0?'today':diff===1?'tomorrow':'in 2 days',age=nextAge(b.date);
msgs.push(`🎂 <b>${esc(b.name)}</b>'s birthday is ${when} (turning ${age})`);
}
}
});
if(changed)save();
if(msgs.length)showNotifStack(msgs);
}
function checkSchedNotifications(){
S.schedule=S.schedule||[];
const todayStr=key(new Date()),todayD=new Date(todayStr+'T00:00:00');
let changed=false;const msgs=[];
S.schedule.forEach(it=>{
if((it.status||'active')!=='active')return;
const d=new Date(it.date+'T00:00:00'),diff=Math.round((d-todayD)/86400000);
if(diff===2||diff===1||diff===0){
it.notified=it.notified||[];
if(!it.notified.includes(todayStr)){
it.notified.push(todayStr);changed=true;
const when=diff===0?'today':diff===1?'tomorrow':'in 2 days';
msgs.push(`${it.type==='work'?'💼':'📅'} <b>${esc(it.title)}</b> is scheduled ${when} (${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})})`);
}
}
});
if(changed)save();
if(msgs.length)showNotifStack(msgs);
}
let notifBox=null;
function placeNotif(){
if(!notifBox)return;
const slot=document.getElementById('notifslot');
if(slot){notifBox.style.cssText='display:flex;flex-direction:row;gap:8px;width:100%;max-width:640px;height:32px;overflow:hidden';if(notifBox.parentNode!==slot)slot.appendChild(notifBox)}
else{notifBox.style.cssText='position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:320px;width:calc(100% - 28px)';if(notifBox.parentNode!==document.body)document.body.appendChild(notifBox)}
}
function showNotifStack(msgs,ms){
if(!notifBox){notifBox=document.createElement('div');notifBox.id='notifstack'}
placeNotif();const box=notifBox;
msgs.forEach(m=>{
const plain=String(m).replace(/<[^>]*>/g,'');
if([...box.children].some(c=>c.title===plain))return;
const card=document.createElement('div');
card.className='card';card.title=plain;
card.style.cssText='margin:0;padding:8px 12px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 8px 24px rgba(0,0,0,.6)';
card.innerHTML=`<span style="flex:1;font-size:13px;line-height:1.4">${m}</span><button style="flex:none;padding:2px 8px" aria-label="Dismiss">✕</button>`;
card.querySelector('button').onclick=()=>card.remove();
box.appendChild(card);
if(ms)setTimeout(()=>card.remove(),ms);
});
}
